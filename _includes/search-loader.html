{% capture result_elem %}
  <article class="px-1 px-sm-2 px-lg-4 px-xl-0">
    <header>
      <h2><a href="{url}">{title}</a></h2>
      <div class="post-meta d-flex flex-column flex-sm-row text-muted mt-1 mb-1">
        {categories}
        {tags}
      </div>
    </header>
    <p>{content}</p>
  </article>
{% endcapture %}

{% capture not_found %}<p class="mt-5">{{ site.data.locales[include.lang].search.no_results }}</p>{% endcapture %}

<script>
  document.addEventListener('DOMContentLoaded', function() {
    var HASH = '64027afcd0ea1d32adfaa4539a8c05c2a535da30753a4d1903d087c27536b23b';
    var AUTH_KEY = 'diary_auth';
    var AUTH_TIME_KEY = 'diary_auth_time';
    var EXPIRES_MS = 24 * 60 * 60 * 1000;
    var stored = localStorage.getItem(AUTH_KEY);
    var storedTime = localStorage.getItem(AUTH_TIME_KEY);
    var isAuthed = stored === HASH && storedTime && Date.now() - Number(storedTime) < EXPIRES_MS;

    var searchInput = document.getElementById('search-input');

    if (searchInput) {
      searchInput.addEventListener('keydown', function(e) {
        if (e.key !== 'Enter') return;
        var val = searchInput.value;
        var encoder = new TextEncoder();
        crypto.subtle.digest('SHA-256', encoder.encode(val)).then(function(buf) {
          var hex = Array.from(new Uint8Array(buf)).map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
          if (hex === HASH) {
            if (isAuthed) {
              localStorage.removeItem(AUTH_KEY);
              localStorage.removeItem(AUTH_TIME_KEY);
            } else {
              localStorage.setItem(AUTH_KEY, HASH);
              localStorage.setItem(AUTH_TIME_KEY, String(Date.now()));
            }
            searchInput.value = '';
            window.location.reload();
          }
        });
      });
    }

    fetch('{{ '/assets/js/data/search.json' | relative_url }}')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var filtered = isAuthed ? data : data.filter(function(item) { return !item.private; });
        SimpleJekyllSearch({
          searchInput: searchInput,
          resultsContainer: document.getElementById('search-results'),
          json: filtered,
          searchResultTemplate: '{{ result_elem | strip_newlines }}',
          noResultsText: '{{ not_found }}',
          templateMiddleware: function(prop, value) {
            if (prop === 'categories') {
              return value === '' ? value : '<div class="me-sm-4"><i class="far fa-folder fa-fw"></i>' + value + '</div>';
            }
            if (prop === 'tags') {
              return value === '' ? value : '<div><i class="fa fa-tag fa-fw"></i>' + value + '</div>';
            }
          }
        });
      });
  });
</script>
